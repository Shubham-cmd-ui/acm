<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LearningHub - AI Learning & Document Intelligence{% endblock %}</title>
    
    <!-- SkyLearn Accessible Typography: Atkinson Hyperlegible (Dyslexia-Friendly Body), Nunito (Display), JetBrains Mono (Scores/Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Application CSS (SkyLearn Design System) -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="skylearn-body">

    <!-- Dyslexia Reading Ruler Overlay -->
    <div id="skylearnReadingRuler" class="skylearn-reading-ruler d-none" aria-hidden="true"></div>

    <!-- SkyLearn Celebration Confetti Canvas (Used on quiz completion) -->
    <canvas id="skylearnConfettiCanvas" class="skylearn-confetti-canvas" aria-hidden="true"></canvas>

    <!-- Top Navigation Bar: SkyLearn Friendly Header -->
    <nav class="navbar navbar-expand-lg skylearn-navbar sticky-top">
        <div class="container-fluid px-3 px-md-4">
            <!-- Brand Logo with Cloud & Star -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'rag_assistant:index' %}">
                <div class="skylearn-logo-badge">
                    <i class="bi bi-cloud-sun-fill text-sky"></i>
                </div>
                <div class="d-flex flex-column">
                    <span class="skylearn-brand-title">Learning<span class="text-sky">Hub</span></span>
                    <span class="skylearn-brand-subtitle d-none d-sm-inline">AI Learning & Tutoring Suite</span>
                </div>
            </a>

            <!-- Center/Right Interactive Badges & Tools -->
            <div class="d-flex align-items-center gap-2 gap-md-3">
                
                <!-- Daily Streak Counter Pill -->
                <div class="streak-pill" id="streakPill" title="Daily Learning Streak">
                    <i class="bi bi-fire text-sun fs-5"></i>
                    <span class="streak-count" id="streakCountNumber">3</span>
                    <span class="streak-label d-none d-sm-inline">Day Streak</span>
                </div>

                <!-- Mode Switcher: Student Mode vs Parent/Teacher View -->
                <div class="mode-switcher-pill d-none d-md-flex" id="modeSwitcherBtn" role="radiogroup" aria-label="Audience View Switcher">
                    <button type="button" class="mode-option active" id="studentModeBtn" role="radio" aria-checked="true" title="Student-friendly large interactive view">
                        <i class="bi bi-backpack-fill me-1"></i> Student
                    </button>
                    <button type="button" class="mode-option" id="teacherModeBtn" role="radio" aria-checked="false" title="Parent & Teacher progress insights view">
                        <i class="bi bi-person-workspace me-1"></i> Teacher/Parent
                    </button>
                </div>

                <!-- Reading Tools Menu -->
                <div class="d-flex align-items-center gap-1">
                    <!-- Reading Ruler Toggle -->
                    <button id="readingRulerToggleBtn" class="btn btn-sm btn-skylearn-tool" title="Toggle Dyslexia-Friendly Reading Ruler line guide">
                        <i class="bi bi-distribute-vertical text-sky"></i>
                        <span class="d-none d-lg-inline ms-1">Ruler</span>
                    </button>

                    <!-- High Contrast Toggle -->
                    <button id="highContrastToggleBtn" class="btn btn-sm btn-skylearn-tool" title="Toggle High-Contrast Accessibility Mode">
                        <i class="bi bi-circle-half text-sky"></i>
                        <span class="d-none d-lg-inline ms-1">Contrast</span>
                    </button>
                </div>

                <!-- AI System Status Pill -->
                {% if has_api_key %}
                <span class="badge bg-leaf-soft text-leaf-deep border-0 py-2 px-3 rounded-pill small fw-bold d-flex align-items-center gap-1 shadow-xs">
                    <i class="bi bi-check-circle-fill text-leaf"></i>
                    <span class="d-none d-sm-inline">Gemini AI Ready</span>
                </span>
                {% else %}
                <span class="badge bg-sun-soft text-sun-deep border-0 py-2 px-3 rounded-pill small fw-bold d-flex align-items-center gap-1" title="Set GEMINI_API_KEY in .env">
                    <i class="bi bi-exclamation-triangle-fill text-sun"></i>
                    <span>Key Missing</span>
                </span>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content Body -->
    <main class="container-fluid py-3 px-md-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Marked.js Markdown Parser & DOMPurify for ChatGPT/Gemini/Claude Quality Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
    <!-- Application JS (SkyLearn Reactive Controller) -->
    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
